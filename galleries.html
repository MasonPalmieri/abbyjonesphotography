<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleries — Abby Jones Photography</title>
  <meta name="description" content="Wedding, couples, and family photography galleries by Abby Jones — Buffalo, Germany, worldwide.">
  <link rel="canonical" href="https://abbyjonesphotography.com/galleries.html">
  <meta property="og:title" content="Galleries — Abby Jones Photography">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://abbyjonesphotography.com/assets/galleries/weddings/wedding-dogs.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

  <nav class="nav nav--solid" data-partial="nav"></nav>

  <section class="section section--tight">
    <div class="container text-center">
      <p class="section__label reveal">Galleries</p>
      <h1 class="section__title reveal">A collection of <em>recent stories.</em></h1>
      <p class="reveal" style="max-width:52ch; margin:24px auto 0; color:var(--ink-soft); line-height:1.75;">
        Explore recent weddings, couples, and family sessions — each a small window into the day it was.
      </p>
    </div>
  </section>

  <section class="section section--tight" style="padding-top:0;">
    <div class="container">
      <div class="collections__grid">
        <a href="galleries/weddings.html" class="collection reveal">
          <img src="assets/galleries/weddings/wedding-dogs.jpg" alt="Weddings collection cover — bride and groom with their dogs">
          <div class="collection__caption">
            <p class="collection__label">Collection 01</p>
            <h2 class="collection__title">Weddings</h2>
          </div>
        </a>
        <a href="galleries/couples.html" class="collection reveal">
          <img src="assets/galleries/couples/rooftop-dip.jpg" alt="Couples collection cover — sunset rooftop dip">
          <div class="collection__caption">
            <p class="collection__label">Collection 02</p>
            <h2 class="collection__title">Couples</h2>
          </div>
        </a>
        <a href="galleries/families.html" class="collection reveal">
          <img src="assets/galleries/families/mom-baby.jpg" alt="Families collection cover — mother and baby portrait">
          <div class="collection__caption">
            <p class="collection__label">Collection 03</p>
            <h2 class="collection__title">Families</h2>
          </div>
        </a>
      </div>
    </div>
  </section>

  <section class="section contact">
    <div class="container">
      <h2 class="contact__title reveal">Ready to <em>tell yours?</em></h2>
      <p class="contact__sub reveal">Every story starts with a conversation.</p>
      <div class="contact__actions reveal">
        <a href="inquire.html" class="btn btn--primary">Start an inquiry
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
  </section>

  <footer class="footer" data-partial="footer"></footer>

  <script src="js/site.js"></script>
</body>
</html>
