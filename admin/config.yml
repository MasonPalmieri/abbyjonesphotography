# Sveltia CMS configuration for Abby Jones Photography
# Docs: https://github.com/sveltia/sveltia-cms
#
# Collections are ordered to mirror the site: Home → About → Pricing →
# Galleries → Testimonials → Journal → Site Settings.

backend:
  name: github
  repo: MasonPalmieri/abbyjonesphotography
  branch: main
  # Sveltia CMS supports Personal Access Token auth directly — no OAuth proxy needed.
  # Abby will click "Sign in with GitHub (PAT)" and paste a token.

site_url: https://abbyjonesphotography.com
display_url: https://abbyjonesphotography.com
logo_url: /assets/site/abby-portrait.jpg

media_folder: assets/galleries
public_folder: /assets/galleries

# Show a friendly editorial workflow (drafts) — Abby's edits become PRs she can review
publish_mode: simple

collections:
  # ============================================================
  # HOME PAGE — every editable section on abbyjonesphotography.com
  # ============================================================
  - name: home
    label: Home Page
    description: >
      Edit each section of the home page. Sections appear in the same order they show up on the site:
      Hero → Intro quote → About preview → Services → Recent Work → Love letter → Contact.
    files:
      - name: home
        label: Home page sections
        file: data/home.json
        format: json
        preview_path: /
        fields:
          - name: hero
            label: 'Hero (top of home page)'
            widget: object
            fields:
              - { name: backgroundImage, label: Background image, widget: image }
              - { name: backgroundImageAlt, label: Background image alt text, widget: string }
              - { name: eyebrow, label: 'Eyebrow (small text above title, e.g. "Weddings · Elopements · Sessions")', widget: string }
              - { name: titleLead, label: 'Title — first word (e.g. "Capturing")', widget: string }
              - name: titleWords
                label: 'Title — rotating words (typewriter effect)'
                widget: list
                summary: '{{fields.word}}'
                hint: 'These words fade in and out one after another. Add, remove, or reorder.'
                field: { name: word, label: Word or phrase, widget: string }
              - { name: titleTrailing, label: 'Title — trailing punctuation (e.g. ".")', widget: string, required: false }
              - { name: sub, label: Sub-headline (paragraph below title), widget: text }
              - { name: ctaLabel, label: Button label, widget: string, default: 'Inquire about your date' }
              - { name: ctaHref, label: Button link, widget: string, default: '/inquire.html' }

          - name: intro
            label: 'Intro quote (small section below hero)'
            widget: object
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: attribution, label: Attribution, widget: string }

          - name: aboutPreview
            label: 'About preview (short intro that links to the About page)'
            widget: object
            hint: 'Portrait photo comes from the About Page collection, so it stays in sync.'
            fields:
              - { name: headline, label: 'Headline (use <em>text</em> to italicize)', widget: string }
              - { name: lead, label: Lead paragraph, widget: text }
              - { name: body, label: Body paragraph, widget: text }
              - { name: linkLabel, label: Link label, widget: string, default: 'Read more about me' }
              - { name: linkHref, label: Link, widget: string, default: '/about.html' }

          - name: services
            label: 'Services (Two ways to work together)'
            widget: object
            fields:
              - { name: label, label: 'Small section label (e.g. "The Experience")', widget: string }
              - { name: title, label: 'Section title (use <em>text</em> to italicize)', widget: string }
              - { name: description, label: Section description, widget: text }
              - name: tiles
                label: Service tiles
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: number, label: 'Number (e.g. "01")', widget: string }
                  - { name: title, label: Tile title, widget: string }
                  - { name: description, label: Tile description, widget: text }
                  - { name: linkLabel, label: Link label, widget: string }
                  - { name: linkHref, label: Link, widget: string }

          - name: recentWork
            label: 'Recent Work (the photo grid section)'
            widget: object
            hint: 'The actual photos come from Galleries → Weddings (any photo marked "Featured on home page").'
            fields:
              - { name: label, label: 'Small section label (e.g. "Recent Work")', widget: string }
              - { name: title, label: 'Section title (use <em>text</em> to italicize)', widget: string }
              - { name: description, label: Section description, widget: text }
              - { name: buttonLabel, label: Button label, widget: string, default: 'Explore all galleries' }
              - { name: buttonHref, label: Button link, widget: string, default: '/galleries.html' }

          - name: loveLetter
            label: 'Love letter (single home-page testimonial)'
            widget: object
            fields:
              - { name: label, label: 'Small section label (e.g. "A love letter")', widget: string }
              - { name: quote, label: Quote, widget: text }
              - { name: footer, label: Attribution / footer, widget: string }

          - name: contact
            label: 'Contact (Let''s tell your story)'
            widget: object
            fields:
              - { name: label, label: 'Small section label (e.g. "Inquiries")', widget: string }
              - { name: title, label: 'Section title (use <em>text</em> to italicize)', widget: string }
              - { name: sub, label: Sub-paragraph, widget: text }
              - { name: primaryCtaLabel, label: Primary button label, widget: string, default: 'Start an inquiry' }
              - { name: primaryCtaHref, label: Primary button link, widget: string, default: '/inquire.html' }
              - { name: secondaryCtaLabel, label: Secondary button label, widget: string, default: 'Follow on Instagram' }
              - { name: bookingYears, label: 'Now booking (e.g. "2026 — 2027")', widget: string }

  # ============================================================
  # ABOUT PAGE
  # ============================================================
  - name: about_page
    label: About Page
    description: 'The standalone About page (abbyjonesphotography.com/about).'
    files:
      - name: about
        label: About Page content
        file: data/about.json
        format: json
        preview_path: /about.html
        fields:
          - { name: portrait, label: Portrait image, widget: image }
          - { name: portraitAlt, label: Portrait alt text, widget: string }
          - name: headline
            label: Headline
            widget: string
            hint: 'Wrap italic words with <em> tags, like: Hi, I''m Abby — <em>so glad you''re here.</em>'
          - { name: lead, label: Lead paragraph, widget: text }
          - { name: body, label: Body paragraphs, widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
          - name: locations
            label: Location badges
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }

          - name: aboutMore
            label: '"A Little More About Me" section intro'
            widget: object
            required: false
            fields:
              - { name: label, label: 'Small label above title (e.g. "A Little More About Me")', widget: string, required: false }
              - name: title
                label: Section title
                widget: string
                required: false
                hint: 'Wrap italic words with <em> tags.'

          - name: family
            label: My Family (heading, text, photos)
            widget: object
            required: false
            hint: 'The "My family" section — heading, story paragraphs, and photos. Leave any photo blank to keep the placeholder.'
            fields:
              - { name: heading, label: 'Section heading (e.g. "My family")', widget: string, required: false }
              - { name: text, label: 'Family story paragraphs', widget: list, required: false, field: { name: paragraph, label: Paragraph, widget: text } }
              - { name: photo1, label: Photo 1 (tall photo on the left), widget: image, required: false }
              - { name: photo1Alt, label: Photo 1 alt text, widget: string, required: false }
              - { name: photo1Caption, label: Photo 1 caption, widget: string, required: false, default: 'Peyton & I' }
              - { name: photo2, label: Photo 2 (top right), widget: image, required: false }
              - { name: photo2Alt, label: Photo 2 alt text, widget: string, required: false }
              - { name: photo2Caption, label: Photo 2 caption, widget: string, required: false, default: 'Oliver' }
              - { name: photo3, label: Photo 3 (bottom right), widget: image, required: false }
              - { name: photo3Alt, label: Photo 3 alt text, widget: string, required: false }
              - { name: photo3Caption, label: Photo 3 caption, widget: string, required: false, default: 'Oliver, Peyton & I' }

          - name: funFacts
            label: Fun facts (numbered tiles)
            widget: object
            required: false
            fields:
              - { name: eyebrow, label: 'Small label above tiles (e.g. "A few things to know")', widget: string, required: false }
              - name: items
                label: Fun fact tiles
                widget: list
                summary: '{{fields.number}} — {{fields.title}}'
                fields:
                  - { name: number, label: 'Number (e.g. "01")', widget: string, required: false }
                  - { name: title, label: Tile title, widget: string }
                  - { name: body, label: Tile body, widget: text }
                  - { name: photo, label: Photo (optional — replaces the placeholder), widget: image, required: false }
                  - { name: photoAlt, label: Photo alt text, widget: string, required: false }
                  - { name: photoCaption, label: 'Placeholder caption (shown when there''s no photo)', widget: string, required: false }

          - name: loveLetter
            label: '"A love letter" testimonial'
            widget: object
            required: false
            fields:
              - { name: label, label: Small label above quote, widget: string, required: false, default: 'A love letter' }
              - { name: quote, label: Testimonial quote, widget: text, required: false }
              - { name: footer, label: 'Attribution (e.g. "— The Smiths")', widget: string, required: false }

          - name: contact
            label: Contact section (bottom of page)
            widget: object
            required: false
            fields:
              - name: title
                label: Section title
                widget: string
                required: false
                hint: 'Wrap italic words with <em> tags.'
              - { name: sub, label: Sub-headline, widget: string, required: false }
              - { name: primaryCtaLabel, label: 'Primary button label (e.g. "Start an inquiry")', widget: string, required: false }
              - { name: primaryCtaHref, label: 'Primary button link (usually /inquire.html)', widget: string, required: false, default: '/inquire.html' }
              - { name: secondaryCtaLabel, label: 'Secondary button label (e.g. "Follow on Instagram")', widget: string, required: false }

  # ============================================================
  # PRICING
  # ============================================================
  - name: pricing
    label: Pricing Page
    description: 'The Pricing page (abbyjonesphotography.com/pricing).'
    files:
      - name: pricing
        label: Pricing sections
        file: data/pricing.json
        format: json
        preview_path: /pricing.html
        fields:
          - { name: intro, label: Intro paragraph, widget: text }
          - name: sections
            label: Pricing sections
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: id, label: 'Section id (e.g. "weddings")', widget: string }
              - { name: label, label: 'Number label (e.g. "01")', widget: string, required: false }
              - { name: name, label: Section name, widget: string }
              - { name: startingAt, label: 'Starting price (e.g. "$2,250" — leave blank to hide)', widget: string, required: false }
              - { name: priceNote, label: 'Small text next to the section-header price (optional, leave blank to hide)', widget: string, required: false }
              - { name: sub, label: Sub-tagline (optional), widget: string, required: false }
              - { name: heroImage, label: Hero image (shown at top of this section), widget: image, required: false }
              - { name: heroImageAlt, label: Hero image alt text, widget: string, required: false }
              - { name: description, label: Description, widget: text, required: false }
              - name: tiers
                label: 'Collection tiers (side-by-side cards, e.g. Intimate / Signature / Full Story)'
                widget: list
                required: false
                summary: '{{fields.name}} — {{fields.price}}'
                hint: 'Leave empty to hide the tier cards. Best with 2–4 tiers.'
                fields:
                  - { name: label, label: 'Small label above name (e.g. "Collection 01")', widget: string, required: false }
                  - { name: name, label: 'Tier name (e.g. "The Signature")', widget: string }
                  - { name: price, label: 'Price (e.g. "$3,500")', widget: string, required: false }
                  - { name: priceNote, label: 'Small text next to the price (optional, e.g. "per hour")', widget: string, required: false }
                  - { name: featured, label: 'Highlight this tier as "Most Popular"?', widget: boolean, default: false }
                  - { name: description, label: One-line description, widget: text, required: false }
                  - { name: includes, label: 'What''s included (one bullet per line)', widget: list, required: false, field: { name: item, label: Bullet, widget: string } }
              - name: groups
                label: Content groups
                widget: list
                summary: '{{fields.heading}}'
                fields:
                  - { name: heading, label: Heading (e.g. "Wedding Collections include"), widget: string }
                  - { name: note, label: Optional note paragraph, widget: text, required: false }
                  - name: items
                    label: Bullet items
                    widget: list
                    required: false
                    field: { name: item, label: Item, widget: string }
              - { name: fineprint, label: Fine print paragraph, widget: text, required: false }
              - name: cta
                label: Call-to-action button
                widget: object
                required: false
                fields:
                  - { name: label, label: Button label, widget: string, default: 'Inquire here' }
                  - { name: href, label: Link, widget: string, default: '/inquire.html' }

  # ============================================================
  # GALLERIES — Abby's primary self-serve editing area
  # ============================================================
  - name: galleries
    label: Galleries
    label_singular: Gallery
    description: >
      Add, remove, and reorder photos in each gallery. Drag images to reorder.
      Mark up to 6 as "Featured" to surface on the home page.
    files:
      - name: weddings
        label: Weddings
        file: data/galleries/weddings.json
        format: json
        preview_path: /galleries/weddings.html
        fields:
          - { name: slug, label: Slug, widget: hidden, default: weddings }
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: text, required: false }
          - { name: cover, label: Cover image (used on Galleries index), widget: image, required: false }
          - { name: emptyMessage, label: Empty-state message, widget: string, required: false }
          - name: images
            label: Photos
            label_singular: Photo
            widget: list
            summary: '{{fields.alt}}'
            fields:
              - { name: src, label: Image, widget: image, media_folder: '/assets/galleries/weddings' }
              - { name: alt, label: Alt text (describe the photo for SEO + accessibility), widget: string }
              - { name: caption, label: Caption (optional, shown in lightbox), widget: string, required: false }
              - { name: featured, label: 'Featured on home page?', widget: boolean, default: false, required: false }

      - name: sessions
        label: Sessions (Couples, Families, Maternity, Seniors, Milestones)
        file: data/galleries/sessions.json
        format: json
        preview_path: /galleries/sessions.html
        fields:
          - { name: slug, label: Slug, widget: hidden, default: sessions }
          - { name: title, label: Title, widget: string }
          - { name: subtitle, label: Subtitle, widget: text, required: false }
          - { name: cover, label: Cover image, widget: image, required: false }
          - { name: emptyMessage, label: Empty-state message, widget: string, required: false }
          - name: images
            label: Photos
            widget: list
            summary: '{{fields.alt}}'
            fields:
              - { name: src, label: Image, widget: image, media_folder: '/assets/galleries/sessions' }
              - { name: alt, label: Alt text, widget: string }
              - { name: caption, label: Caption, widget: string, required: false }
              - { name: featured, label: 'Featured on home page?', widget: boolean, default: false, required: false }

  # ============================================================
  # TESTIMONIALS — coming soon by default, but Abby can add as she collects them
  # ============================================================
  - name: testimonials
    label: Testimonials
    files:
      - name: testimonials
        label: Testimonials
        file: data/testimonials.json
        format: json
        fields:
          - { name: comingSoon, label: 'Show "coming soon" placeholder?', widget: boolean, default: true }
          - { name: comingSoonMessage, label: Coming-soon message, widget: string, required: false }
          - name: items
            label: Testimonials
            widget: list
            summary: '{{fields.author}}'
            hint: 'Each one becomes a slide in the scrollable carousel on the home page. Photos are optional — add up to 3 per testimonial.'
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: author, label: Author (e.g. "Sarah + Ben, 2026"), widget: string }
              - { name: sessionType, label: Session type, widget: string, required: false }
              - name: photos
                label: 'Photos (optional, up to 3)'
                widget: list
                required: false
                max: 3
                summary: '{{fields.alt}}'
                fields:
                  - { name: src, label: Photo, widget: image }
                  - { name: alt, label: Alt text (describe the photo), widget: string, required: false }

  # ============================================================
  # BLOG / JOURNAL — coming soon
  # ============================================================
  - name: blog
    label: Journal
    files:
      - name: blog
        label: Journal settings
        file: data/blog.json
        format: json
        fields:
          - { name: comingSoon, label: 'Coming soon mode?', widget: boolean, default: true }
          - name: posts
            label: Posts (when ready)
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: slug, label: URL slug, widget: string }
              - { name: date, label: Date, widget: datetime }
              - { name: cover, label: Cover image, widget: image, required: false }
              - { name: excerpt, label: Excerpt, widget: text, required: false }
              - { name: body, label: Post body (Markdown), widget: markdown }

  # ============================================================
  # DESIGN — curated fonts, accent color, section styling
  # ============================================================
  - name: design
    label: Design
    description: >
      Choose from a curated set of fonts and accent colors. These are
      pre-tested to look good on the site. For anything outside these
      options (a specific font, custom color palette, layout tweak, or
      section reorder), text Mason.
    files:
      - name: theme
        label: Theme
        file: data/theme.json
        format: json
        preview_path: /
        fields:
          - name: headingFont
            label: Heading font (titles and section headers)
            widget: select
            default: 'Cormorant Garamond'
            options:
              - { label: 'Cormorant Garamond (current — classic wedding serif)', value: 'Cormorant Garamond' }
              - { label: 'Playfair Display (dramatic, high contrast)', value: 'Playfair Display' }
              - { label: 'Fraunces (warm, characterful)', value: 'Fraunces' }
              - { label: 'DM Serif Display (bold, editorial)', value: 'DM Serif Display' }
              - { label: 'Cormorant Infant (softer version of current)', value: 'Cormorant Infant' }
          - name: bodyFont
            label: Body font (paragraphs, buttons, small text)
            widget: select
            default: 'Inter'
            options:
              - { label: 'Inter (current — clean, modern)', value: 'Inter' }
              - { label: 'Nunito Sans (soft, friendly)', value: 'Nunito Sans' }
              - { label: 'Lato (warm, humanist)', value: 'Lato' }
              - { label: 'Montserrat (geometric, editorial)', value: 'Montserrat' }
              - { label: 'Work Sans (crisp, minimal)', value: 'Work Sans' }
          - name: accentColor
            label: Accent color (links, hover states, small highlights)
            widget: select
            default: '#7D8874'
            options:
              - { label: 'Muted Sage (current)', value: '#7D8874' }
              - { label: 'Deep Olive', value: '#3E493D' }
              - { label: 'Blush Pink', value: '#B78F82' }
              - { label: 'Warm Terracotta', value: '#B87B5C' }
              - { label: 'Slate Blue', value: '#6B7A8C' }
              - { label: 'Charcoal', value: '#292B28' }
          - name: sectionAlternate
            label: 'Alternate section backgrounds? (soft cream / ivory stripes)'
            widget: boolean
            default: false
            hint: "Turn on to give every other section a slightly different background so they don't blend together."
          - name: _note
            label: 'Need something different?'
            widget: string
            required: false
            default: 'Want a different font, custom color, section reorder, or layout change? Text Mason.'
            hint: "This field is a reminder only — you don't need to fill it in."

  # ============================================================
  # SITE SETTINGS — top-level knobs (email, tagline, socials)
  # ============================================================
  - name: settings
    label: Site Settings
    description: 'Global settings that apply across the whole site.'
    files:
      - name: site
        label: General
        file: data/site.json
        format: json
        fields:
          - { name: siteName, label: Site name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: email, label: Contact email, widget: string }
          - { name: instagramHandle, label: Instagram handle (no @), widget: string }
          - { name: instagramUrl, label: Instagram URL, widget: string }
          - { name: bookingYears, label: Booking years text, widget: string, hint: 'e.g. "2026 — 2027"' }
          - { name: primaryLocation, label: Primary location, widget: string }
          - { name: secondaryLocation, label: Secondary location, widget: string }
          - { name: serviceArea, label: Service area, widget: string }
          - { name: formEndpoint, label: Inquiry form endpoint (Formspree URL), widget: string, required: false, hint: 'Paste your Formspree endpoint here to activate the inquiry form.' }
          - name: socialProof
            label: Social proof
            widget: object
            fields:
              - { name: showTestimonials, label: 'Show testimonials section?', widget: boolean, default: true }
              - { name: testimonialsComingSoon, label: 'Show "coming soon" placeholder?', widget: boolean, default: true }
